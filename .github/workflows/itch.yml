name: Build WebGL and Upload to itch.io

on:
  push:
    branches:
      - itchio

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cache Unity builds so future builds are faster
      - uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            Library-${{ runner.os }}-

      # Build the Unity project
      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: WebGL  # this enables IL2CPP + WebGL automatically
          unityVersion: 2022.3.40f1  # change to match your project
          buildName: webgl
          buildPath: build

      # Zip the build output
      - name: Zip WebGL build
        run: |
          cd build/WebGL
          zip -r ../../webgl.zip .

      # Install itch.io Butler CLI
      - name: Install Butler
        run: |
          curl -L https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default > butler.zip
          unzip butler.zip butler
          chmod +x butler
          sudo mv butler /usr/local/bin/

      # Upload the build
      - name: Upload to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler push webgl.zip yourname/yourgame:webgl
